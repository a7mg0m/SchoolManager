name: smart_school_parent
description: Smart School Parent Flutter starter template.
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.3.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  flutter_map: ^8.3.2
  http: ^1.6.0
  image_picker: ^1.2.4
  latlong2: ^0.10.1
  shared_preferences: ^2.5.6
  url_launcher: ^6.3.3
  video_player: ^2.14.1

  geolocator: ^14.1.2
  firebase_core: ^5.2.0
  firebase_messaging: ^17.1.0
  flutter_local_notifications: ^23.0.4
  signalr_netcore: ^1.4.4
  record: ^7.2.0
  just_audio: ^0.10.6
  path_provider: ^2.1.6
  http_parser: ^4.1.2
dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0
  # Launcher icons from app_setup.json (dart run tool/setup_app.dart)
  flutter_launcher_icons: ^0.14.4

flutter:
  uses-material-design: true

  assets:
    - assets/images/
