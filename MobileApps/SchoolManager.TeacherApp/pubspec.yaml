name: smart_school_teacher
description: "Smart School Teacher app."
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: ^3.14.0

dependencies:
  firebase_core: ^5.2.0
  firebase_messaging: ^17.1.0
  flutter:
    sdk: flutter
  flutter_local_notifications: ^23.0.4
  flutter_localizations:
    sdk: flutter
  # Same packages as the parent app (shared login, theme, school info with map / album / video)
  flutter_map: ^8.3.2
  http: ^1.6.0
  http_parser: ^4.1.2
  image_picker: ^1.2.4
  just_audio: ^0.10.6
  latlong2: ^0.10.1
  path_provider: ^2.1.6
  record: ^7.2.0
  shared_preferences: ^2.5.6
  signalr_netcore: ^1.4.4
  url_launcher: ^6.3.3
  video_player: ^2.14.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  # Launcher icons from app_setup.json (dart run tool/setup_app.dart)
  flutter_launcher_icons: ^0.14.4

flutter:
  uses-material-design: true
  assets:
    - assets/images/
