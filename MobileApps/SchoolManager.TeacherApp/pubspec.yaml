name: smart_school_teacher
description: "Smart School Teacher app."
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: ^3.14.0

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  # Same packages as the parent app (shared login, theme, school info with map / album / video)
  flutter_map: ^8.3.2
  http: ^1.6.0
  image_picker: ^1.2.4
  latlong2: ^0.10.1
  shared_preferences: ^2.5.6
  url_launcher: ^6.3.3
  video_player: ^2.14.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/images/
